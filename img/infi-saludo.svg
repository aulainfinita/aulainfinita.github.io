<svg id="infi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 392" width="380" height="392" role="img" aria-label="Infi, robot educativo con ojos de infinito que sostiene un monitor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Infi v2.1</title>
  <defs>
    <pattern id="infi-cuadricula" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12,0 L0,0 0,12" fill="none" stroke="#22D3EE" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <filter id="infi-neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="cuerpo">
    <!-- PIERNAS Y PIES -->
    <g id="piernas">
      <rect id="pierna-izq" x="150" y="285" width="34" height="78" rx="17" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <rect id="pierna-der" x="196" y="285" width="34" height="78" rx="17" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <rect class="neon" x="152" y="318" width="30" height="5" rx="2.5" fill="#39FF14" filter="url(#infi-neon)"/>
      <rect class="neon" x="198" y="318" width="30" height="5" rx="2.5" fill="#39FF14" filter="url(#infi-neon)"/>
      <path id="pie-izq" d="M138,382 L138,374 Q138,354 162,354 Q186,354 186,374 L186,382 Z" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <path id="pie-der" d="M194,382 L194,374 Q194,354 218,354 Q242,354 242,374 L242,382 Z" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <path class="neon" d="M142,377 H182 M198,377 H238" stroke="#39FF14" stroke-width="3" stroke-linecap="round" filter="url(#infi-neon)"/>
    </g>

    <!-- TORSO (queda detrás del monitor) -->
    <g id="torso">
      <rect x="110" y="150" width="160" height="44" rx="22" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <circle class="neon" cx="122" cy="172" r="4" fill="#39FF14" filter="url(#infi-neon)"/>
      <circle class="neon" cx="258" cy="172" r="4" fill="#39FF14" filter="url(#infi-neon)"/>
    </g>

    <!-- BRAZOS: giran desde el hombro (izq 88,165 / der 292,165) -->
    <g id="brazo-izq" style="transform-origin:88px 165px">
      <path d="M88,165 L42,235 L50,282" fill="none" stroke="#1E2540" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M88,165 L42,235 L50,282" fill="none" stroke="#D6D8DE" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="neon" d="M88,165 L42,235 L50,282" fill="none" stroke="#39FF14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#infi-neon)"/>
    </g>
    <g id="brazo-der" style="transform-origin:292px 165px">
      <path d="M292,165 L338,235 L330,282" fill="none" stroke="#1E2540" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M292,165 L338,235 L330,282" fill="none" stroke="#D6D8DE" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="neon" d="M292,165 L338,235 L330,282" fill="none" stroke="#39FF14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#infi-neon)"/>
    </g>

    <!-- CUELLO -->
    <g id="cuello">
      <rect x="178" y="134" width="24" height="20" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <rect class="neon" x="179" y="140" width="22" height="3.5" rx="1.75" fill="#39FF14" filter="url(#infi-neon)"/>
    </g>

    <!-- CABEZA -->
    <g id="cabeza" style="transform-origin:190px 140px">
      <g id="antena">
        <rect x="187" y="18" width="6" height="22" fill="#3B4670" stroke="#1E2540" stroke-width="1.5"/>
        <circle id="antena-esfera" cx="190" cy="14" r="9" fill="#FBBF24" stroke="#1E2540" stroke-width="2"/>
      </g>
      <rect id="casco" x="115" y="38" width="150" height="102" rx="40" fill="#3B4670" stroke="#1E2540" stroke-width="2"/>
      <rect id="visor" x="123" y="46" width="134" height="86" rx="32" fill="#0B1026"/>
      <g id="ojos" style="transform-origin:190px 84px">
        <path id="infinito" d="M190,84 C182,72 175,68 165,68 C153,68 143,75 143,84 C143,93 153,100 165,100 C175,100 182,96 190,84 C198,72 205,68 215,68 C227,68 237,75 237,84 C237,93 227,100 215,100 C205,100 198,96 190,84 Z" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linejoin="round"/>
        <circle id="pupila-izq" cx="165" cy="84" r="4" fill="#FFFFFF"/>
        <circle id="pupila-der" cx="215" cy="84" r="4" fill="#FFFFFF"/>
      </g>
      <path id="boca" d="M182,112 Q190,119 198,112" fill="none" stroke="#22D3EE" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- MONITOR -->
    <g id="monitor">
      <rect id="monitor-marco" x="45" y="168" width="290" height="132" rx="16" fill="#3B4670" stroke="#1E2540" stroke-width="2"/>
      <path class="neon" d="M60,300 H320" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" filter="url(#infi-neon)"/>
      <rect id="monitor-pantalla" x="52" y="175" width="276" height="118" rx="10" fill="#0B1026"/>

      <g id="barra-superior">
        <g id="icono-menu" fill="#22D3EE">
          <rect x="60" y="181" width="11" height="1.6" rx=".8"/>
          <rect x="60" y="185" width="11" height="1.6" rx=".8"/>
          <rect x="60" y="189" width="11" height="1.6" rx=".8"/>
        </g>
        <text id="modo" x="78" y="190" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="500" fill="#22D3EE">INICIO</text>
        <rect id="icono-modo" x="185" y="180" width="10" height="12" rx="2" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
        <text id="tema" x="320" y="190" text-anchor="end" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" fill="#F5F7FF"><tspan fill="#22D3EE">Tema:</tspan> Bienvenida</text>
      </g>
      <path id="divisor-superior" d="M58,198 H160 L166,202 H214 L220,198 H322" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.5"/>

      <g id="area-principal">
        <rect x="60" y="205" width="260" height="62" rx="6" fill="url(#infi-cuadricula)" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.35"/>
        <path id="esquinas-hud" d="M60,214 v-9 h9 M320,214 v-9 h-9 M60,258 v9 h9 M320,258 v9 h-9" fill="none" stroke="#22D3EE" stroke-width="2"/>
        <g id="contenido-principal">
          <text x="190" y="248" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="26" font-weight="600" fill="#22D3EE">¡Hola, soy Infi!</text>
        </g>
      </g>

      <path id="divisor-inferior" d="M58,272 H322" stroke="#22D3EE" stroke-width="1" opacity="0.35"/>
      <text id="barra-inferior" x="190" y="286" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" fill="#F5F7FF"><tspan fill="#FBBF24" font-weight="500">Dato:</tspan> aquí aprender no tiene límite</text>
    </g>

    <!-- MANOS: van encima del monitor y giran igual que su brazo -->
    <g id="mano-izq" style="transform-origin:88px 165px">
      <circle cx="50" cy="288" r="15" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <path d="M42,282 q8,-5 16,0" fill="none" stroke="#1E2540" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="mano-der" style="transform-origin:292px 165px">
      <circle cx="330" cy="288" r="15" fill="#D6D8DE" stroke="#1E2540" stroke-width="2"/>
      <path d="M322,282 q8,-5 16,0" fill="none" stroke="#1E2540" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
